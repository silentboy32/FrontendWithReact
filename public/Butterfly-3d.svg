
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Blue gradient for the wings -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Dark gradient for the body -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="50%" stop-color="#4a4a4a" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>

    <!-- Drop shadow to make it float -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Entire butterfly group with shadow -->
  <g filter="url(#shadow)">
    
    <!-- ================= ANTENNAE ================= -->
    <path d="M240 180 Q 220 140 215 120" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="215" cy="118" r="10" fill="#1a1a1a" />
    
    <path d="M272 180 Q 292 140 297 120" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="297" cy="118" r="10" fill="#1a1a1a" />

    <!-- ================= WINGS ================= -->
    <!-- Left Upper Wing -->
    <path
      d="M240 240 C 200 150, 100 130, 70 190 C 50 235, 90 300, 170 310 C 215 315, 240 285, 240 240 Z"
      fill="url(#wingGrad)"
      stroke="#0a0a0a"
      stroke-width="6"
    />
    <!-- Left Lower Wing -->
    <path
      d="M240 285 C 220 340, 155 400, 120 380 C 90 360, 130 315, 185 305 C 215 300, 235 290, 240 285 Z"
      fill="url(#wingGrad)"
      stroke="#0a0a0a"
      stroke-width="6"
    />

    <!-- Right Upper Wing -->
    <path
      d="M272 240 C 312 150, 412 130, 442 190 C 462 235, 422 300, 342 310 C 297 315, 272 285, 272 240 Z"
      fill="url(#wingGrad)"
      stroke="#0a0a0a"
      stroke-width="6"
    />
    <!-- Right Lower Wing -->
    <path
      d="M272 285 C 292 340, 357 400, 392 380 C 422 360, 382 315, 327 305 C 297 300, 277 290, 272 285 Z"
      fill="url(#wingGrad)"
      stroke="#0a0a0a"
      stroke-width="6"
    />

    <!-- ================= WING DETAILS (Spots & Highlights) ================= -->
    <!-- Left Wing Spots -->
    <circle cx="155" cy="225" r="14" fill="#ffffff" opacity="0.8" />
    <circle cx="180" cy="350" r="10" fill="#ffffff" opacity="0.8" />
    <circle cx="100" cy="270" r="8" fill="#ffffff" opacity="0.6" />
    <circle cx="140" cy="290" r="6" fill="#ffffff" opacity="0.6" />

    <!-- Right Wing Spots -->
    <circle cx="357" cy="225" r="14" fill="#ffffff" opacity="0.8" />
    <circle cx="332" cy="350" r="10" fill="#ffffff" opacity="0.8" />
    <circle cx="412" cy="270" r="8" fill="#ffffff" opacity="0.6" />
    <circle cx="372" cy="290" r="6" fill="#ffffff" opacity="0.6" />

    <!-- ================= BODY ================= -->
    <!-- Body (Abdomen & Thorax) -->
    <ellipse cx="256" cy="270" rx="18" ry="85" fill="url(#bodyGrad)" />
    
    <!-- Head -->
    <circle cx="256" cy="195" r="22" fill="url(#bodyGrad)" />

    <!-- ================= BODY HIGHLIGHTS (3D effect) ================= -->
    <!-- Body gloss line -->
    <ellipse cx="250" cy="265" rx="5" ry="60" fill="#ffffff" opacity="0.25" />
    <!-- Head gloss dot -->
    <circle cx="252" cy="190" r="6" fill="#ffffff" opacity="0.4" />

  </g>
</svg>