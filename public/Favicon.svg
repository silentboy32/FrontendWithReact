
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="120" fill="url(#g2)"/>

  <!-- Antenna -->
  <line x1="256" y1="120" x2="256" y2="60"
        stroke="white" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="48" r="22" fill="white"/>

  <!-- Main head -->
  <rect x="80" y="140" width="352" height="300" rx="80" fill="white"/>

  <!-- Eyes -->
  <circle cx="180" cy="270" r="30" fill="url(#g2)"/>
  <circle cx="332" cy="270" r="30" fill="url(#g2)"/>

  <!-- Smile -->
  <path d="M180 350 Q256 400 332 350"
        stroke="url(#g2)" stroke-width="22" stroke-linecap="round" fill="none"/>

  <!-- Side ears -->
  <rect x="40" y="240" width="40" height="100" rx="20" fill="white"/>
  <rect x="432" y="240" width="40" height="100" rx="20" fill="white"/>
</svg>